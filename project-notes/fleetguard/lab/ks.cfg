# RHEL 9.8 lab VM for fleetguard - unattended install (KVM guest, not bare metal)

# --- Install mode and source ---
text
cdrom
skipx
firstboot --disable
reboot

# --- Locale ---
lang en_US.UTF-8
keyboard --xlayouts='us'
timezone America/New_York --utc

# --- Network ---
network --bootproto=dhcp --device=link --activate --onboot=on --hostname=rhel9-lab

# --- Security ---
selinux --enforcing
firewall --enabled --service=ssh

# --- Disk: wipe vda, platform partitions, /boot, LVM for the rest ---
ignoredisk --only-use=vda
zerombr
clearpart --all --initlabel --drives=vda
reqpart
part /boot --fstype=xfs --size=1024 --ondisk=vda
part pv.01 --size=1 --grow --ondisk=vda
volgroup rhel pv.01
logvol swap --vgname=rhel --name=swap --size=1024
logvol /    --vgname=rhel --name=root --fstype=xfs --size=8192 --grow
bootloader --boot-drive=vda

# --- Accounts: root locked, key-only user ---
rootpw --lock
user --name=jeetg --groups=wheel --lock
sshkey --username=jeetg "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMNpn0VrYwE30nulWSbRSMdsgawXJLGI9jLeTODEZqZv abhijeet.gulhane.317@gmail.com"

# --- Packages ---
%packages
@^minimal-environment
openssh-server
qemu-guest-agent
chrony
tar
%end

# --- Disable kdump (reserves RAM a 4 GB lab VM can't spare) ---
%addon com_redhat_kdump --disable
%end

# --- Post-install ---
%post --log=/root/ks-post.log
echo 'jeetg ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/jeetg
chmod 0440 /etc/sudoers.d/jeetg
visudo -cf /etc/sudoers.d/jeetg

cat > /etc/ssh/sshd_config.d/10-lab.conf <<'EOF'
PasswordAuthentication no
PermitRootLogin no
EOF
chmod 0600 /etc/ssh/sshd_config.d/10-lab.conf

systemctl enable qemu-guest-agent
%end
